name: Signed feed

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: Select the feed verification, tagging or publication phase
        required: true
        type: choice
        options: [fixture, tag, verify-release, publish]
      authorize_recovery:
        description: Approve the retained recovery bundle or one eligible identical-byte retry
        type: boolean
        default: false
      authorize_retirement:
        description: Approve catalogue withdrawal under the retained retirement plan
        type: boolean
        default: false
      reviewed_source:
        description: Exact approved source SHA (publication only)
        type: string
      version_run:
        description: Approved shared version workflow run ID (publication only)
        type: string
      version_attempt:
        description: Approved shared version workflow run attempt (publication only)
        type: string
      release:
        description: Exact retained release tag for read-only verification
        type: string
      candidate:
        description: SHA-256 of the independently retained candidate archive
        type: string
      recovery:
        description: SHA-256 of the independently retained recovery archive
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.mode == 'tag' || inputs.mode == 'verify-release' || inputs.mode == 'publish') && 'native-package-pages-publisher' || format('native-package-pages-fixture-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ inputs.mode != 'tag' && inputs.mode != 'verify-release' && inputs.mode != 'publish' }}

jobs:
  fixture:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'fixture'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/package/feed-publisher-http.mjs
      - run: bash tests/package/feed-preflight-test.sh

  native-verifier:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'fixture'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Boot disposable native verifier
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: '15.1'
          arch: x86_64
          sync: rsync
          copyback: true
          disable-cache: true
          run: |
            sh scripts/prepare-feed-verifier.sh
            test "$(pkg-static config ABI)" = FreeBSD:15:amd64
            sh tests/package/hosted-feed-content.sh work/native-feed
      - name: Verify the signed native fixture through the Pages adapter
        env:
          NATIVE_FEED_DIRECTORY: work/native-feed
        run: node --test tests/package/feed-publisher-http.mjs

  tag:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'tag' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: signed-feed-production
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_source }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify the approved main source and calculation
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.SIGNED_FEED_PRODUCTION_APPROVED }}
          SOURCE: ${{ inputs.reviewed_source }}
          RUN: ${{ inputs.version_run }}
          ATTEMPT: ${{ inputs.version_attempt }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          test "$ENABLED" = true
          [[ "$SOURCE" =~ ^[a-f0-9]{40}$ && "$RUN" =~ ^[0-9]+$ && "$ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$RELEASE" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor "$SOURCE" origin/main
          revision=3b78b04df802ea1592cbe19338d7a882d1888389
          workflow="vhco-pro/version-workflow/.github/workflows/version.yml@$revision"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT" |
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg source "$SOURCE" --arg workflow "$workflow" --arg revision "$revision" '
              .repository.full_name == $repo and .head_sha == $source and .head_branch == "main"
              and .event == "push" and .conclusion == "success" and .path == ".github/workflows/php.yml"
              and any(.referenced_workflows[]?; .path == $workflow and .sha == $revision)
            ' >/dev/null
          git switch -C main "$SOURCE"
      - name: Check the shared action calculation before tagging
        id: calculation
        uses: michielvha/gitversion-tag-action@8cf5869816cf71437052ac97d086e00526bf2d89 # v7.0.4
        with:
          prefix: v
          dry-run: 'true'
      - name: Confirm the exact tag and source
        env:
          SOURCE: ${{ inputs.reviewed_source }}
          RELEASE: ${{ inputs.release }}
          CALCULATED_SHA: ${{ steps.calculation.outputs.Sha }}
          CALCULATED_VERSION: ${{ steps.calculation.outputs.semVer }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$CALCULATED_SHA" = "$SOURCE"
          test "v$CALCULATED_VERSION" = "$RELEASE"
      - name: Tag through the shared GitVersion action
        uses: michielvha/gitversion-tag-action@8cf5869816cf71437052ac97d086e00526bf2d89 # v7.0.4
        with:
          prefix: v
          dry-run: 'false'
      - name: Verify the remote tag
        env:
          SOURCE: ${{ inputs.reviewed_source }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE"

  verify-release:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: signed-feed-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Retrieve independently retained bundle bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CANDIDATE: ${{ inputs.candidate }}
          RECOVERY: ${{ inputs.recovery }}
        run: |
          destination=$(mktemp -d)
          bash scripts/feed-bundles.sh "$RELEASE" "$CANDIDATE" "$RECOVERY" "$destination"
          for digest in "$CANDIDATE" "$RECOVERY"; do
            mkdir "$destination/$digest"
            bash scripts/feed-payload.sh "$destination/feed-$digest.tar" "$digest" "$destination/$digest"
          done

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && github.ref == 'refs/heads/main' && vars.SIGNED_FEED_PRODUCTION_APPROVED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: signed-feed-production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check production configuration
        env:
          ENABLED: ${{ vars.SIGNED_FEED_PRODUCTION_APPROVED }}
        run: test "$ENABLED" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.reviewed_source }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Boot disposable native verifier
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: '15.1'
          arch: x86_64
          sync: rsync
          copyback: false
          disable-cache: true
          run: |
            sh scripts/prepare-feed-verifier.sh
            test "$(pkg-static config ABI)" = FreeBSD:15:amd64
      - name: Verify approved inputs and run the publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_RETIREMENT_AUTHORIZED: ${{ inputs.authorize_retirement }}
          FEED_OPERATOR_KEY: ${{ vars.SIGNED_FEED_OPERATOR_KEY_PATH }}
          FEED_RECOVERY_AUTHORIZED: ${{ inputs.authorize_recovery }}
          FEED_PRODUCTION_APPROVED: ${{ vars.SIGNED_FEED_PRODUCTION_APPROVED }}
          FEED_ASSET_TOKEN: ${{ secrets.FEED_ASSET_TOKEN }}
          FEED_JOURNAL_TOKEN: ${{ secrets.FEED_JOURNAL_TOKEN }}
          PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          PAGES_API: ${{ vars.CLOUDFLARE_PAGES_API }}
          PAGES_ASSET_API: https://api.cloudflare.com/client/v4/pages/assets
          PAGES_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH }}
          FEED_URL: ${{ vars.SIGNED_FEED_URL }}
          PUBLIC_KEY_PEM: ${{ vars.SIGNED_FEED_PUBLIC_KEY_PEM }}
          PUBLIC_KEY_SHA256: ${{ vars.SIGNED_FEED_PUBLIC_KEY_SHA256 }}
          FEED_PREDECESSOR_PUBLIC_KEY: ${{ vars.SIGNED_FEED_PREDECESSOR_KEY_PATH }}
          FEED_NATIVE_SSH: freebsd
          FEED_ABI: ${{ vars.SIGNED_FEED_ABI }}
          RELEASE: ${{ inputs.release }}
          APPROVED_SOURCE: ${{ inputs.reviewed_source }}
          VERSION_RUN: ${{ inputs.version_run }}
          VERSION_ATTEMPT: ${{ inputs.version_attempt }}
          CANDIDATE: ${{ inputs.candidate }}
          RECOVERY: ${{ inputs.recovery }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VERSION_RUN" =~ ^[0-9]+$ && "$VERSION_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$RELEASE" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-(alpha|beta|rc)[.][0-9]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE"
          git merge-base --is-ancestor "$APPROVED_SOURCE" origin/main
          directory=$(mktemp -d)
          trap 'rm -rf -- "$directory"' EXIT
          [[ "$PUBLIC_KEY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          export FEED_PUBLIC_KEY="$directory/feed-signing-public.pem"
          printf '%s\n' "$PUBLIC_KEY_PEM" > "$FEED_PUBLIC_KEY"
          actual=$(openssl pkey -pubin -in "$FEED_PUBLIC_KEY" -outform DER | sha256sum | cut -d ' ' -f 1)
          test "$actual" = "$PUBLIC_KEY_SHA256"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERSION_RUN/attempts/$VERSION_ATTEMPT" > "$directory/run.json"
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "version-$VERSION_RUN-$VERSION_ATTEMPT.json" --dir "$directory"
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern advertised-packages.json --dir "$directory"
          if gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern operator-evidence.json \
            --pattern operator-evidence.sig --dir "$directory"; then
            export FEED_OPERATOR_EVIDENCE="$directory/operator-evidence.json"
            export FEED_OPERATOR_SIGNATURE="$directory/operator-evidence.sig"
          fi
          tag_sha=$(git rev-parse --verify "refs/tags/$RELEASE^{commit}")
          bash scripts/feed-dispatch.sh production "$directory/version-$VERSION_RUN-$VERSION_ATTEMPT.json" \
            "$directory/run.json" "$APPROVED_SOURCE" "$tag_sha" "$CANDIDATE" "$RECOVERY" "$directory/advertised-packages.json"
