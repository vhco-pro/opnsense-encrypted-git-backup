name: Native browser

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ format('native-browser-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  opnsense-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Install fixture build and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso libnss3-tools
          if [[ -c /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          bun install --frozen-lockfile --ignore-scripts
          bun x playwright install --with-deps chromium firefox
      - name: Install exact plugin package and exercise native Backups
        run: |
          mkdir -p "$RUNNER_TEMP/opnsense-browser"
          bash tests/appliance/browser.sh "$RUNNER_TEMP/opnsense-browser"
      - name: Retain sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/opnsense-browser/artifacts/**/status-mobile.png
            ${{ runner.temp }}/opnsense-browser/artifacts/**/status-narrow-reduced-motion.png
            ${{ runner.temp }}/opnsense-browser/artifacts/*-real-zoom.png
            ${{ runner.temp }}/opnsense-browser/artifacts/*-zoom.log
          if-no-files-found: warn
          retention-days: 5
