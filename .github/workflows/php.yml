name: PHP checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    container: php@sha256:50956f094e90a716d43bea28087d447555ad80510e386ab8c9c10d8c70d781a9
    steps:
      - name: Install tool prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends git unzip
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch pinned platform symbols
        run: |
          git init work/upstream/core
          git -C work/upstream/core fetch --depth=1 https://github.com/opnsense/core.git e1020455a7bbb8a94ecdcec4fa94cd2ee3bdbbc1
          git -C work/upstream/core checkout --detach FETCH_HEAD
      - name: Install locked tools
        run: |
          curl -fsSL https://getcomposer.org/download/2.11.2/composer.phar -o work/composer.phar
          sha256sum -c <<'SUM'
          dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028  work/composer.phar
          SUM
          php work/composer.phar install --no-interaction --prefer-dist
          php work/composer.phar check-platform-reqs
      - name: Check syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check style, types and behavior
        run: |
          vendor/bin/phpcs
          vendor/bin/phpstan analyse --no-progress
          vendor/bin/phpunit
