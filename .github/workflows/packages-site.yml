name: Packages site

on:
  pull_request:
    paths: ['web/packages/**', 'tests/packages/**', 'package.json', 'bun.lock', 'renovate.json', '.gitignore', '.github/workflows/packages-site.yml']
  push:
    branches: [main]
    paths: ['web/packages/**', 'tests/packages/**', 'package.json', 'bun.lock', 'renovate.json', '.gitignore', '.github/workflows/packages-site.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ${{ format('packages-site-verify-{0}', github.event.pull_request.number || github.ref) }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun x playwright install --with-deps chromium firefox
      - run: bun test tests/packages/source.test.ts tests/packages/delivery.test.ts
      - run: bun web/packages/verify.ts
      - id: secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: dir --redact=100 --no-banner --config web/packages/.gitleaks.toml web/packages/
      - run: bun web/packages/scanner-check.ts
      - run: bun web/packages/restoration-check.ts
      - run: bun run packages:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: packages-site-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/packages-browser/
          retention-days: 3

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PACKAGES_SITE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: packages-site-production
    concurrency:
      group: vhco-packages-site-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun web/packages/verify.ts
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: |
            versions upload --config web/packages/wrangler.toml --name ${{ vars.CLOUDFLARE_WORKER_NAME }} --tag site-${{ github.run_id }}-${{ github.run_attempt }}
            versions deploy --config web/packages/wrangler.toml --name ${{ vars.CLOUDFLARE_WORKER_NAME }} --version-tag site-${{ github.run_id }}-${{ github.run_attempt }} --yes
      - run: bun run packages:smoke
        env:
          CLOUDFLARE_SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
