name: Feature request
description: Suggest a new feature or enhancement
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Use synthetic values in your steps. Keep firewall
        exports, backups, credentials, hostnames, IP addresses, account names, Git
        URLs, and identifying repository or branch names out of the report.
        For a suspected vulnerability, follow the
        [security policy](https://github.com/vhco-pro/opnsense-encrypted-git-backup/security/policy).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case and current pain.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Share relevant public links or a synthetic example.

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
