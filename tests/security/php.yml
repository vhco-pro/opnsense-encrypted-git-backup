rules:
  - id: php-dynamic-shell
    languages: [php]
    message: Keep dynamic backup inputs out of shell command strings.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: shell_exec($COMMAND)
          - pattern: exec($COMMAND, ...)
          - pattern: system($COMMAND, ...)
          - pattern: passthru($COMMAND, ...)
      - pattern-not: $FUNC("...", ...)
  - id: php-request-file-or-html
    languages: [php]
    message: Validate request data before file access and escape before HTML output.
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
    pattern-sanitizers:
      - pattern: htmlspecialchars(...)
      - pattern: html_safe(...)
    pattern-sinks:
      - pattern-either:
          - pattern: file_get_contents(...)
          - pattern: file_put_contents(...)
          - pattern: echo $VALUE;
  - id: php-xml-entity-expansion
    languages: [php]
    message: Keep external entity substitution disabled.
    severity: ERROR
    pattern-either:
      - pattern: $DOC->substituteEntities = true
      - pattern: $DOC->resolveExternals = true
      - pattern: $DOC->loadXML($DATA, LIBXML_NOENT)
