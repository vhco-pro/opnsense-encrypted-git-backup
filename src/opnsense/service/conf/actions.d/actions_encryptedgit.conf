[run]
command:/usr/local/bin/php /usr/local/opnsense/scripts/encryptedgit/run.php
parameters:
type:script_output
allowed_groups:wheel,wwwonly
message:Run encrypted Git backup

[check]
command:/usr/local/bin/php /usr/local/opnsense/scripts/encryptedgit/check.php
parameters:%s %s %s %s %s
type:script_output
allowed_groups:wheel,wwwonly
message:Check encrypted Git backup activation

[status]
command:/usr/local/bin/php /usr/local/opnsense/scripts/encryptedgit/status.php
parameters:
type:script_output
allowed_groups:wheel,wwwonly
message:Read encrypted Git backup status
